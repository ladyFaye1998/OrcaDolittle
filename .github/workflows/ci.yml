name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  smoke-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install lightweight test stack
        run: python -m pip install --upgrade pip pytest numpy scipy scikit-learn matplotlib
      - name: Run lightweight regression tests
        run: pytest -q
